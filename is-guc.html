    /* HERO */
    .hero { background: var(--ink); padding: 52px 24px 44px; text-align: center; position: relative; overflow: hidden; color: #fff; }
    .hero-inner { position: relative; max-width: 720px; margin: 0 auto; }

    .hero h1 span { color: #fff; }
    .hero-sub { font-size: 15px; color: rgba(255,255,255,.6); line-height: 1.65; margin-bottom: 28px; }

    /* SEARCH BAR */
    .hero-search { display: flex; gap: 8px; max-width: 600px; margin: 0 auto 28px; background: #fff; border-radius: 12px; padding: 6px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }

    .hero-search button:hover { background: var(--red2); }
    .btn-gold { padding: 11px 20px; background: var(--gold); color: var(--ink); border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }

    /* STATS */
    .hero-stats { display: flex; justify-content: center; gap: 32px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,.1); }
    .hstat-val { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #fff; }
    .hstat-label { font-size: 11px; color: rgba(255,255,255,.4); margin-top: 1px; }

    /* BODY */
    .page-body { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
    .job-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .job-card { background: var(--white); border: 1px solid var(--sand); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 10px; transition: all .2s; }
    .job-card:hover { border-color: var(--navy); box-shadow: 0 6px 24px rgba(27,58,140,.08); transform: translateY(-2px); }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(26,18,8,.55); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border-radius: 20px; max-width: 520px; width: 92%; max-height: 92vh; display: flex; flex-direction: column; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 5px; }
    .form-input { width: 100%; padding: 10px 12px; border: 1.5px solid var(--sand); border-radius: 9px; font-family: inherit; font-size: 13px; color: var(--ink); background: var(--cream); outline: none; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
