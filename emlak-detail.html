<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizdenBize — İlan</title>
  <meta name="description" content="BizdenBize'de ilanlar, ikinci el eşya ve daha fazlası. Gurbet Hayatını Kolaylaştırıyoruz.">
  <!-- Social sharing preview (OpenGraph / Twitter) -->
  <meta property="og:site_name" content="BizdenBize">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BizdenBize — İlan">
  <meta property="og:description" content="BizdenBize'de ilanlar, ikinci el eşya ve daha fazlası. Gurbet Hayatını Kolaylaştırıyoruz.">
  <meta property="og:image" content="https://bizdenbize.com/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="BizdenBize — İlan">
  <meta name="twitter:description" content="BizdenBize'de ilanlar, ikinci el eşya ve daha fazlası. Gurbet Hayatını Kolaylaştırıyoruz.">
  <meta name="twitter:image" content="https://bizdenbize.com/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:#D42B2B;--red2:#E8393A;--navy:#1B3A8C;--navy2:#2348A8;
      --cream:#FAF7F2;--warm:#F0EAE0;--sand:#D4C5A9;
      --ink:#1A1208;--muted:#6B5E4E;--white:#FFFFFF;--gold:#C9A84C;--green:#1E7B4B;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--ink);}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(250,247,242,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,197,169,.4);}
    .nav-left{display:flex;align-items:center;gap:16px;}
    .nav-logo-link{display:flex;align-items:center;text-decoration:none;}
    .nav-logo-link img{height:44px;width:auto;}
    .nav-tabs{display:flex;gap:2px;}
    .nav-tab{padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;font-family:'Instrument Sans',sans-serif;transition:all .15s;text-decoration:none;}
    .nav-tab:hover{background:var(--warm);color:var(--ink);}
    .nav-tab.active{background:var(--navy);color:var(--white);}
    .nav-right{display:flex;align-items:center;gap:10px;}
    .nav-avatar{width:34px;height:34px;border-radius:50%;background:var(--red);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;cursor:pointer;}

    /* Breadcrumb */
    .breadcrumb{padding:72px 40px 0;max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
    .breadcrumb a{color:var(--muted);text-decoration:none;transition:color .15s;}
    .breadcrumb a:hover{color:var(--navy);}
    .breadcrumb span{color:var(--sand);}

    .page{padding:16px 40px 60px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start;}

    /* ── LEFT ── */
    /* Image gallery */
    .gallery{margin-bottom:20px;}
    .main-img{height:380px;background:var(--warm);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:80px;position:relative;overflow:hidden;cursor:pointer;margin-bottom:10px;border:1px solid var(--sand);}
    .img-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);border:none;border-radius:50%;width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .img-nav:hover{background:var(--white);box-shadow:0 2px 8px rgba(0,0,0,.12);}
    .img-prev{left:12px;}
    .img-next{right:12px;}
    .img-counter{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .thumbs{display:flex;gap:8px;}
    .thumb{width:72px;height:56px;border-radius:8px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;flex-shrink:0;}
    .thumb.active{border-color:var(--navy);}
    .thumb:hover{border-color:var(--sand);}

    /* Listing info */
    .listing-info{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:24px;margin-bottom:16px;}
    .li-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;}
    .li-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(30,123,75,.1);color:var(--green);}
    .save-btn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--sand);background:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .save-btn:hover{border-color:var(--red);color:var(--red);}
    .li-price{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;color:var(--ink);line-height:1;margin-bottom:6px;}
    .li-title{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:10px;}
    .li-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
    .li-tag{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);background:var(--warm);padding:4px 10px;border-radius:20px;}
    .li-desc{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:16px;}
    .li-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;border-top:1px solid var(--warm);padding-top:16px;}
    .ls-item{text-align:center;}
    .ls-val{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--ink);}
    .ls-label{font-size:11px;color:var(--muted);margin-top:2px;}

    /* Details table */
    .details-card{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:20px;margin-bottom:16px;}
    .dc-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:14px;}
    .details-table{width:100%;border-collapse:collapse;}
    .details-table tr:nth-child(odd) td{background:rgba(250,247,242,.6);}
    .details-table td{padding:9px 12px;font-size:13px;border-bottom:1px solid var(--warm);}
    .details-table td:first-child{color:var(--muted);font-weight:500;width:40%;}
    .details-table td:last-child{color:var(--ink);}
    .details-table tr:last-child td{border-bottom:none;}

    /* Similar listings */
    .similar-card{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:20px;}
    .sc-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:14px;}
    .similar-list{display:flex;flex-direction:column;gap:10px;}
    .sim-item{display:flex;gap:12px;cursor:pointer;padding:8px;border-radius:10px;transition:background .15s;}
    .sim-item:hover{background:var(--warm);}
    .sim-thumb{width:60px;height:50px;border-radius:8px;background:var(--warm);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
    .sim-price{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--ink);}
    .sim-title{font-size:12px;color:var(--muted);margin-top:1px;}

    /* ── RIGHT ── */
    .right-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px;}

    /* Seller card */
    .seller-card{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:20px;}
    .seller-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
    .seller-avatar{width:52px;height:52px;border-radius:50%;background:var(--red);color:var(--white);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;}
    .seller-name{font-size:15px;font-weight:600;color:var(--ink);}
    .seller-meta{font-size:12px;color:var(--muted);margin-top:2px;}
    .seller-verified{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;background:rgba(30,123,75,.1);color:var(--green);margin-top:4px;}
    .seller-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
    .ss-item{text-align:center;padding:8px 4px;background:var(--cream);border-radius:8px;}
    .ss-val{font-size:16px;font-weight:700;color:var(--ink);}
    .ss-label{font-size:10px;color:var(--muted);margin-top:1px;}
    .contact-btns{display:flex;flex-direction:column;gap:8px;}
    .contact-btn{width:100%;padding:12px;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;border:none;}
    .contact-btn.primary{background:var(--navy);color:var(--white);}
    .contact-btn.primary:hover{background:var(--navy2);}
    .contact-btn.secondary{background:var(--warm);color:var(--ink);border:1.5px solid var(--sand);}
    .contact-btn.secondary:hover{border-color:var(--navy);}
    .contact-btn.danger{background:none;color:var(--red);border:1.5px solid rgba(212,43,43,.2);}
    .contact-btn.danger:hover{background:rgba(212,43,43,.05);}

    /* Price offer */
    .offer-card{background:var(--white);border:1px solid var(--sand);border-radius:16px;padding:20px;}
    .oc-title{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;}
    .oc-sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
    .offer-input-wrap{display:flex;gap:8px;}
    .offer-input{flex:1;padding:10px 14px;border:1.5px solid var(--sand);border-radius:8px;font-size:14px;font-family:'Instrument Sans',sans-serif;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s;}
    .offer-input:focus{border-color:var(--navy);}
    .offer-btn{padding:10px 16px;background:var(--gold);color:var(--ink);border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:opacity .2s;white-space:nowrap;}
    .offer-btn:hover{opacity:.9;}

    /* Safety tips */
    .safety-card{background:rgba(27,58,140,.04);border:1px solid rgba(27,58,140,.15);border-radius:14px;padding:16px;}
    .safety-title{font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .safety-tips{display:flex;flex-direction:column;gap:5px;}
    .safety-tip{font-size:11px;color:var(--muted);display:flex;gap:6px;line-height:1.4;}
    .safety-tip::before{content:'✓';color:var(--navy);font-weight:700;flex-shrink:0;}

    @media(max-width:900px){
      .page{grid-template-columns:1fr;padding:16px 20px 60px;}
      .right-col{position:static;}
      .breadcrumb{padding:72px 20px 0;}
    }
  
    /* ── MOBILE NAV ── */
    .hamburger {
      display: none; flex-direction: column; gap: 5px;
      background: none; border: none; cursor: pointer;
      padding: 6px; border-radius: 8px; transition: background .15s;
      flex-shrink: 0;
    }
    .hamburger:hover { background: var(--warm, #F0EAE0); }
    .hamburger span {
      display: block; width: 22px; height: 2px;
      background: var(--ink, #1A1208); border-radius: 2px;
      transition: transform .3s, opacity .3s;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-menu {
      display: none; position: fixed;
      top: 58px; left: 0; right: 0; bottom: 0;
      background: var(--white, #fff); z-index: 99;
      flex-direction: column; overflow-y: auto;
      border-top: 1px solid rgba(212,197,169,.4);
      animation: slideDown .2s ease;
    }
    .mobile-menu.open { display: flex; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .mm-user {
      display: flex; align-items: center; gap: 14px;
      padding: 20px 24px;
      background: var(--navy, #1B3A8C);
    }
    .mm-avatar {
      width: 46px; height: 46px; border-radius: 50%;
      background: var(--red, #D42B2B); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; flex-shrink: 0;
    }
    .mm-name { font-size: 15px; font-weight: 600; color: #fff; }
    .mm-status { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 2px; }
    .mm-links { display: flex; flex-direction: column; padding: 12px 16px; gap: 2px; flex: 1; }
    .mm-link {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 12px; border-radius: 10px;
      font-size: 15px; font-weight: 500;
      color: var(--ink, #1A1208); text-decoration: none;
      transition: background .15s; cursor: pointer;
    }
    .mm-link:hover { background: var(--warm, #F0EAE0); }
    .mm-link.active { background: rgba(27,58,140,.07); color: var(--navy, #1B3A8C); font-weight: 600; }
    .mm-link-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
    .mm-badge {
      margin-left: auto; font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      background: var(--red, #D42B2B); color: #fff;
    }
    .mm-divider { height: 1px; background: rgba(212,197,169,.35); margin: 8px 16px; }
    .mm-section-label {
      font-size: 10px; font-weight: 600; letter-spacing: .09em;
      text-transform: uppercase; color: var(--muted, #6B5E4E);
      padding: 8px 24px 4px;
    }
    .mm-footer {
      padding: 16px 24px 32px;
      border-top: 1px solid rgba(212,197,169,.25);
    }
    .mm-logout {
      display: flex; align-items: center; gap: 10px;
      font-size: 14px; color: var(--red, #D42B2B);
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-weight: 500; padding: 8px 0;
    }

    @media (max-width: 768px) {
      .nav-tabs { display: none !important; }
      .hamburger { display: flex !important; }
      .nav-search { max-width: 160px !important; }
    }
    @media (max-width: 480px) {
      .nav-search { display: none !important; }
    }

  
  /* ── COOKIE CONSENT BANNER ── */
  #cookie-banner {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: var(--ink, #1A1208);
    border-top: 1px solid rgba(255,255,255,.1);
    padding: 20px 32px;
    display: none;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    box-shadow: 0 -8px 40px rgba(0,0,0,.25);
    animation: slideUpBanner .4s cubic-bezier(.16,1,.3,1);
  }
  #cookie-banner.visible { display: flex; }
  @keyframes slideUpBanner {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .cb-logo { flex-shrink: 0; display: flex; align-items: center; }
  .cb-logo img { height: 28px; width: auto; filter: brightness(0) invert(1); }
  .cb-text { flex: 1; min-width: 240px; }
  .cb-title {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 14px; font-weight: 600;
    color: #fff; margin-bottom: 4px;
  }
  .cb-desc {
    font-family: 'Instrument Sans', sans-serif;
    font-size: 12px; color: rgba(255,255,255,.5);
    line-height: 1.55;
  }
  .cb-desc a {
    color: rgba(255,255,255,.7);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .cb-desc a:hover { color: #fff; }
  .cb-actions { display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .cb-btn {
    padding: 10px 20px; border-radius: 8px;
    font-family: 'Instrument Sans', sans-serif;
    font-size: 13px; font-weight: 600;
    cursor: pointer; border: none;
    transition: all .15s; white-space: nowrap;
  }
  .cb-accept {
    background: #D42B2B; color: #fff;
  }
  .cb-accept:hover { background: #E8393A; }
  .cb-essential {
    background: rgba(255,255,255,.1);
    color: rgba(255,255,255,.8);
    border: 1px solid rgba(255,255,255,.15) !important;
  }
  .cb-essential:hover { background: rgba(255,255,255,.18); color: #fff; }
  .cb-manage {
    background: none; color: rgba(255,255,255,.5);
    border: 1px solid rgba(255,255,255,.15) !important;
  }
  .cb-manage:hover { color: #fff; border-color: rgba(255,255,255,.4) !important; }

  /* Cookie preferences modal */
  #cookie-modal {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(26,18,8,.7);
    display: none; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  #cookie-modal.open { display: flex; }
  .cm-box {
    background: #fff; border-radius: 20px;
    padding: 0; max-width: 520px; width: 90%;
    max-height: 85vh; overflow-y: auto;
    animation: popIn .3s cubic-bezier(.16,1,.3,1);
    font-family: 'Instrument Sans', sans-serif;
  }
  @keyframes popIn {
    from { transform: scale(.95); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .cm-header {
    padding: 24px 24px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px;
  }
  .cm-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px; font-weight: 700; color: #1A1208;
  }
  .cm-sub { font-size: 13px; color: #6B5E4E; margin-top: 4px; line-height: 1.5; }
  .cm-close {
    background: none; border: none; font-size: 22px;
    color: #6B5E4E; cursor: pointer; flex-shrink: 0;
    margin: -4px -4px 0 12px; line-height: 1;
  }
  .cm-categories { padding: 0 24px; display: flex; flex-direction: column; gap: 2px; }
  .cm-cat {
    border: 1px solid #F0EAE0; border-radius: 12px;
    overflow: hidden;
  }
  .cm-cat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; cursor: pointer;
    background: #FAF7F2; transition: background .15s;
    user-select: none;
  }
  .cm-cat-header:hover { background: #F0EAE0; }
  .cm-cat-icon { font-size: 18px; flex-shrink: 0; }
  .cm-cat-info { flex: 1; }
  .cm-cat-name { font-size: 13px; font-weight: 600; color: #1A1208; }
  .cm-cat-desc { font-size: 11px; color: #6B5E4E; margin-top: 2px; }
  /* Toggle switch */
  .cm-toggle {
    width: 40px; height: 22px; border-radius: 11px;
    background: #D4C5A9; position: relative; flex-shrink: 0;
    cursor: pointer; transition: background .2s; border: none;
  }
  .cm-toggle.on { background: #1B3A8C; }
  .cm-toggle.locked { background: #1E7B4B; cursor: not-allowed; }
  .cm-toggle::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; border-radius: 50%;
    background: #fff; transition: transform .2s;
  }
  .cm-toggle.on::after, .cm-toggle.locked::after { transform: translateX(18px); }
  .cm-chevron { font-size: 12px; color: #6B5E4E; transition: transform .2s; flex-shrink: 0; }
  .cm-cat.open .cm-chevron { transform: rotate(180deg); }
  .cm-cat-body { display: none; padding: 12px 16px; background: #fff; border-top: 1px solid #F0EAE0; }
  .cm-cat.open .cm-cat-body { display: block; }
  .cm-cat-detail { font-size: 12px; color: #6B5E4E; line-height: 1.6; }
  .cm-cat-detail strong { color: #1A1208; }

  .cm-footer {
    padding: 20px 24px 24px; display: flex; gap: 8px;
    border-top: 1px solid #F0EAE0; margin-top: 16px;
  }
  .cm-save {
    flex: 1; padding: 12px; background: #1B3A8C; color: #fff;
    border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Instrument Sans', sans-serif;
    transition: background .15s;
  }
  .cm-save:hover { background: #2348A8; }
  .cm-accept-all {
    flex: 1; padding: 12px; background: #D42B2B; color: #fff;
    border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: 'Instrument Sans', sans-serif;
    transition: background .15s;
  }
  .cm-accept-all:hover { background: #E8393A; }
    @media (max-width: 900px) { }
  </style>
