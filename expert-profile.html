<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BizdenBize — Uzman Profili</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="platform-config.js"></script>
  <style>
    :root{--red:#D42B2B;--red2:#E8393A;--cream:#FAF7F2;--warm:#F0EAE0;--sand:#D4C5A9;--ink:#1A1208;--muted:#6B5E4E;--gold:#C9A84C;--green:#1E7B4B;--navy:#1B3A8C;--white:#FFFFFF;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Instrument Sans',sans-serif;background:var(--cream);color:var(--ink);}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(250,247,242,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(212,197,169,.4);}
    .nav-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:900;color:var(--ink);text-decoration:none;}
    .nav-logo span{color:var(--red);}
    .nav-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:7px;transition:all .15s;}
    .nav-back:hover{background:var(--warm);color:var(--ink);}
    .nav-right{display:flex;align-items:center;gap:10px;}

    /* LAYOUT */
    .page{padding:78px 24px 60px;max-width:860px;margin:0 auto;}

    /* HERO */
    .hero{background:var(--white);border:1px solid var(--sand);border-radius:20px;padding:32px;display:flex;gap:28px;align-items:flex-start;margin-bottom:20px;}
    .hero-avatar{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--white);flex-shrink:0;font-family:'Playfair Display',serif;}
    .hero-info{flex:1;min-width:0;}
    .hero-name{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--ink);line-height:1.2;margin-bottom:4px;}
    .hero-title{font-size:15px;color:var(--muted);margin-bottom:12px;}
    .hero-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
    .badge{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;}
    .badge-verified{background:rgba(30,123,75,.1);color:var(--green);border:1px solid rgba(30,123,75,.2);}
    .badge-cat{background:rgba(27,58,140,.08);color:var(--navy);border:1px solid rgba(27,58,140,.15);}
    .badge-lang{background:var(--warm);color:var(--muted);border:1px solid var(--sand);}
    .hero-bio{font-size:14px;color:var(--muted);line-height:1.7;}
    .hero-cta{margin-top:18px;}
    .btn-primary{display:inline-flex;align-items:center;gap:8px;padding:11px 24px;background:var(--red);color:var(--white);border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;font-family:'Instrument Sans',sans-serif;transition:background .15s;}
    .btn-primary:hover{background:var(--red2);}

    /* STATS ROW */
    .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
    .stat-card{background:var(--white);border:1px solid var(--sand);border-radius:14px;padding:20px 16px;text-align:center;}
    .stat-val{font-family:'Playfair Display',serif;font-size:30px;font-weight:900;line-height:1;margin-bottom:4px;}
    .stat-label{font-size:12px;color:var(--muted);}
    .stat-stars{font-size:20px;line-height:1;margin-bottom:4px;}

    /* REVIEWS SECTION */
    .section-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
    .review-list{display:flex;flex-direction:column;gap:10px;}
    .review-item{background:var(--white);border:1px solid var(--sand);border-radius:12px;padding:16px 18px;}
    .review-stars{font-size:16px;margin-bottom:6px;}
    .review-comment{font-size:13px;color:var(--ink);line-height:1.6;font-style:italic;}
    .review-meta{font-size:11px;color:var(--sand);margin-top:8px;}
    .review-cat{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--warm);color:var(--muted);display:inline-block;margin-bottom:6px;}

    /* EMPTY / LOADING */
    /* Direct ask modal */
    .modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(26,18,8,.6);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
    .modal-overlay.open{display:flex;}
    .modal-box{background:var(--white);border-radius:20px;max-width:500px;width:92%;animation:popIn .3s ease;display:flex;flex-direction:column;max-height:92vh;}
    @keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
    .modal-head{padding:24px 24px 16px;border-bottom:1px solid var(--warm);flex-shrink:0;}
    .modal-body{padding:20px 24px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;}
    .modal-foot{padding:16px 24px 24px;border-top:1px solid var(--warm);flex-shrink:0;}
    .field-label{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;display:block;}
    .cat-select{width:100%;padding:10px 14px;border:1.5px solid var(--sand);border-radius:9px;font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s;}
    .cat-select:focus{border-color:var(--ink);}
    .question-ta{width:100%;padding:12px 14px;border:1.5px solid var(--sand);border-radius:9px;font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--white);outline:none;resize:vertical;min-height:120px;line-height:1.6;transition:border-color .2s;}
    .question-ta:focus{border-color:var(--ink);}
    .price-pill{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--warm);border:1px solid var(--sand);border-radius:9px;}
    .price-pill.insufficient{background:rgba(212,43,43,.05);border-color:rgba(212,43,43,.2);}
    .btn-confirm{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:background .15s;}
    .btn-confirm:hover{background:#176040;}
    .btn-confirm:disabled{background:var(--sand);cursor:not-allowed;}
    .btn-cancel{width:100%;padding:11px;background:none;color:var(--muted);border:1.5px solid var(--sand);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;margin-top:8px;transition:all .15s;}
    .btn-cancel:hover{border-color:var(--red);color:var(--red);}

    /* REPORT */
    .btn-report-expert{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;background:none;border:1.5px solid rgba(212,43,43,.2);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .15s;}
    .btn-report-expert:hover{border-color:var(--red);color:var(--red);background:rgba(212,43,43,.04);}
    .report-modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(26,18,8,.55);display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
    .report-modal-overlay.open{display:flex;}
    .report-modal-box{background:var(--white);border-radius:18px;max-width:440px;width:92%;padding:28px;animation:popIn .25s ease;}
    .report-select,.report-textarea{width:100%;padding:10px 14px;border:1.5px solid var(--sand);border-radius:9px;font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--ink);background:var(--cream);outline:none;transition:border-color .2s;margin-bottom:10px;}
    .report-select:focus,.report-textarea:focus{border-color:var(--ink);}
    .report-textarea{resize:vertical;min-height:80px;line-height:1.6;}
    .no-reviews-icon{font-size:32px;margin-bottom:8px;}
    .no-reviews-text{font-size:13px;color:var(--muted);}

    /* ERROR */
    .error-state{text-align:center;padding:80px 20px;}
    .error-icon{font-size:48px;margin-bottom:16px;}
    .error-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:8px;}
    .error-sub{font-size:14px;color:var(--muted);}

    @media(max-width:640px){
      .hero{flex-direction:column;gap:20px;padding:20px;}
      .stats-row{grid-template-columns:1fr 1fr;}
      .stats-row .stat-card:last-child{grid-column:1/-1;}
      .hero-name{font-size:22px;}
    }

    /* OWNER PANEL — private, visible only to the logged-in expert viewing their own profile */
    .owner-panel{margin-top:32px;border:1.5px dashed var(--navy);border-radius:20px;padding:24px;background:rgba(27,58,140,.03);}
    .owner-panel-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
    .owner-panel-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);}
    .owner-panel-note{font-size:12px;color:var(--muted);margin-bottom:16px;}
    .owner-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
    .owner-tab{padding:7px 14px;border-radius:20px;border:1.5px solid var(--sand);background:var(--white);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:all .15s;}
    .owner-tab.active{background:var(--navy);border-color:var(--navy);color:var(--white);}
    .owner-card{background:var(--white);border:1px solid var(--sand);border-radius:14px;padding:16px 18px;margin-bottom:10px;}
    .owner-card.urgent{border-color:var(--red);}
    .owner-card-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .owner-card-user{font-size:13px;font-weight:600;color:var(--ink);flex:1;}
    .owner-card-status{font-size:10px;font-weight:600;padding:3px 10px;border-radius:20px;flex-shrink:0;}
    .owner-status-pending{background:rgba(201,168,76,.15);color:#854F0B;}
    .owner-status-assigned{background:rgba(27,58,140,.1);color:var(--navy);}
    .owner-status-answered{background:rgba(30,123,75,.1);color:var(--green);}
    .owner-card-time{font-size:11px;color:var(--muted);flex-shrink:0;}
    .owner-question{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:12px;padding:12px;background:var(--cream);border-radius:8px;border-left:3px solid var(--navy);}
    .owner-abibot-answer{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:12px;padding:14px 16px;background:#FFF9EC;border:1.5px solid #E8D9A8;border-left:4px solid var(--gold);border-radius:8px;}
    .owner-abibot-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A6D1F;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .owner-abibot-toggle{font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;margin-top:6px;display:inline-block;}
    .owner-abibot-body.collapsed{max-height:90px;overflow:hidden;position:relative;mask-image:linear-gradient(to bottom, black 50%, transparent 100%);-webkit-mask-image:linear-gradient(to bottom, black 50%, transparent 100%);}
    .owner-response-ta{width:100%;padding:11px 13px;border:1.5px solid var(--sand);border-radius:9px;font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--ink);background:var(--white);outline:none;resize:vertical;min-height:100px;line-height:1.6;margin-bottom:8px;}
    .owner-response-ta:focus{border-color:var(--navy);}
    .owner-submit-btn{padding:9px 20px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;}
    .owner-submit-btn:disabled{background:var(--sand);cursor:not-allowed;}
    .owner-answered-box{padding:12px;background:rgba(30,123,75,.05);border-radius:8px;border-left:3px solid var(--green);font-size:13px;color:var(--ink);line-height:1.6;}
    .owner-unclaimed-note{padding:11px 13px;background:var(--warm);border-radius:8px;border-left:3px solid var(--sand);font-size:12px;color:var(--muted);}
    .owner-empty{text-align:center;padding:24px;font-size:13px;color:var(--muted);}
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Bizden<span>Bize</span></a>
  <div class="nav-right">
    <a href="uzmanlar.html" class="nav-back">← Tüm Uzmanlar</a>
    <a href="abibot.html" class="btn-primary" style="font-size:12px;padding:8px 16px;">🤖 AbiBOT</a>
  </div>
</nav>

<div class="page" id="page-content">
  <div class="loading">
    <div style="font-size:32px;margin-bottom:12px;">⏳</div>
    <div>Uzman profili yükleniyor...</div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL  = 'https://wxjudojlwksivhzjnmim.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_52tr_hEnnQ3kllZexTue0Q_ByF71303';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

  const CAT_ICONS = window.BB_CONFIG.categoryIcons;
  const CAT_NAMES = window.BB_CONFIG.categoryLabels;
  const LANG_FLAGS = { tr:'🇹🇷', de:'🇩🇪', en:'🇬🇧', fr:'🇫🇷', nl:'🇳🇱' };
  const AVATAR_COLORS = ['#D42B2B','#1B3A8C','#1E7B4B','#C9A84C','#185FA5','#7B4B8C'];

  // Get expert_id from URL
  const params = new URLSearchParams(window.location.search);
  const expertId = params.get('id');

  if (!expertId) {
    showError('Uzman bulunamadı', 'Geçerli bir uzman ID\'si belirtilmedi.');
  } else {
    loadProfile(expertId);
  }

  async function loadProfile(id) {
    try {
      // Fetch expert summary from view + recent rated reviews
      const [summaryRes, reviewsRes] = await Promise.all([
        supabase.from('expert_rating_summary').select('*').eq('expert_id', id).single(),
        supabase.from('expert_reviews')
          .select('category, rating, rating_comment, rated_at')
          .eq('expert_id', id)
          .eq('status', 'answered')
          .not('rating', 'is', null)
          .order('rated_at', { ascending: false })
          .limit(10)
      ]);

      if (summaryRes.error || !summaryRes.data) {
        showError('Uzman bulunamadı', 'Bu profile ait bir uzman bulunamadı.');
        return;
      }

      renderProfile(summaryRes.data, reviewsRes.data || []);
      renderOwnerPanelIfApplicable(summaryRes.data.expert_id);
    } catch(e) {
      console.error(e);
      showError('Bir hata oluştu', 'Profil yüklenirken sorun oluştu. Lütfen tekrar deneyin.');
    }
  }

  // ===== OWNER PANEL (private — only the logged-in expert viewing their own profile) =====
  let myExpertId = null;
  let myExpertName = 'Bir uzman';
  let mySession = null;
  let myReviews = [];
  let myFilter = 'all';

  const OWNER_CAT_ICONS = CAT_ICONS;
  const OWNER_STATUS_LABELS = { pending:'Bekliyor', assigned:'Atandı', in_review:'İncelemede', answered:'Yanıtlandı', closed:'Kapatıldı' };

  async function renderOwnerPanelIfApplicable(expertRowId) {
    try {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const { data: expertRow } = await supabase.from('experts').select('id, profile_id').eq('id', expertRowId).single();
      if (!expertRow || expertRow.profile_id !== session.user.id) return; // not the owner — public view stays as-is

      mySession = session;
      myExpertId = expertRow.id;

      const { data: myProfile } = await supabase.from('profiles').select('first_name, last_name').eq('id', session.user.id).single();
      myExpertName = myProfile ? `${myProfile.first_name || ''} ${myProfile.last_name || ''}`.trim() : 'Bir uzman';

      const { data: reviews } = await supabase.from('expert_reviews')
        .select('*, profiles:user_id(first_name, last_name, city)')
        .or(`expert_id.eq.${expertRow.id},expert_id.is.null`)
        .order('created_at', { ascending: false });

      myReviews = reviews || [];
      injectOwnerPanel();
    } catch(e) {
      console.error('Owner panel check failed:', e);
    }
  }

  function myTimeAgo(date) {
    const diff = Date.now() - new Date(date).getTime();
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (h < 1) return 'Az önce';
    if (h < 24) return `${h} saat önce`;
    return `${d} gün önce`;
  }

  function myMdToHtml(text) {
    if (!text) return '';
    return text.replace(/\n/g, '<br>');
  }

  // AbiBOT's stored answers contain real markdown (headers, bold, bullet lists) —
  // this renders it properly instead of showing raw # / ** / - characters to the expert.
  function renderAbibotMarkdown(text) {
    if (!text) return '';
    const lines = text.split('\n');
    let html = '';
    let inList = false;
    for (let line of lines) {
      line = line.trim();
      if (!line) { if (inList) { html += '</ul>'; inList = false; } continue; }

      const inlineBold = (s) => s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

      if (/^###\s+/.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="font-size:13px;font-weight:700;color:var(--ink);margin:12px 0 4px;">${inlineBold(line.replace(/^###\s+/, ''))}</div>`;
      } else if (/^##\s+/.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 6px;">${inlineBold(line.replace(/^##\s+/, ''))}</div>`;
      } else if (/^#\s+/.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="font-size:15px;font-weight:700;color:var(--ink);margin:14px 0 6px;">${inlineBold(line.replace(/^#\s+/, ''))}</div>`;
      } else if (/^-\s+/.test(line)) {
        if (!inList) { html += '<ul style="margin:4px 0 8px;padding-left:20px;">'; inList = true; }
        html += `<li style="margin-bottom:3px;">${inlineBold(line.replace(/^-\s+/, ''))}</li>`;
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += `<div style="margin-bottom:6px;">${inlineBold(line)}</div>`;
      }
    }
    if (inList) html += '</ul>';
    return html;
  }

  function injectOwnerPanel() {
    if (document.getElementById('owner-panel')) return; // already injected
    const wrap = document.createElement('div');
    wrap.className = 'owner-panel';
    wrap.id = 'owner-panel';
    wrap.innerHTML = `
      <div class="owner-panel-head">
        <div class="owner-panel-title">🔒 Sorularım</div>
      </div>
      <div class="owner-panel-note">Bu bölümü yalnızca siz görebilirsiniz — size atanan sorular ve ekip havuzundaki atanmamış sorular burada listelenir.</div>
      <div class="owner-tabs" id="owner-tabs">
        <button class="owner-tab active" onclick="setMyFilter('all', this)">Tümü</button>
        <button class="owner-tab" onclick="setMyFilter('assigned', this)">Bana Atanan</button>
        <button class="owner-tab" onclick="setMyFilter('pool', this)">Ekip Havuzu</button>
        <button class="owner-tab" onclick="setMyFilter('answered', this)">Yanıtladıklarım</button>
      </div>
      <div id="owner-reviews-list"></div>
    `;
    document.getElementById('page-content').appendChild(wrap);
    renderMyReviews();
  }

  window.setMyFilter = function(filter, btn) {
    myFilter = filter;
    document.querySelectorAll('#owner-tabs .owner-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMyReviews();
  };

  function renderMyReviews() {
    let list = myReviews;
    if (myFilter === 'assigned') {
      list = list.filter(r => r.expert_id === myExpertId && r.status !== 'answered' && r.status !== 'closed');
    } else if (myFilter === 'pool') {
      list = list.filter(r => r.expert_id === null && r.status !== 'answered' && r.status !== 'closed');
    } else if (myFilter === 'answered') {
      list = list.filter(r => r.status === 'answered' || r.status === 'closed');
    }

    const container = document.getElementById('owner-reviews-list');
    if (!list.length) {
      container.innerHTML = `<div class="owner-empty">Bu filtrede soru yok.</div>`;
      return;
    }

    container.innerHTML = list.map(r => {
      const user = r.profiles;
      const userName = user ? `${user.first_name || ''} ${user.last_name || ''}`.trim() : 'Kullanıcı';
      const isMine = r.expert_id === myExpertId;
      const isAnswered = r.status === 'answered' || r.status === 'closed';
      const statusClass = `owner-status-${r.status === 'in_review' ? 'assigned' : r.status}`;

      let actionHtml;
      if (isAnswered) {
        actionHtml = `<div class="owner-answered-box">${myMdToHtml(r.expert_response || '')}</div>`;
      } else if (isMine && (r.claim_status === 'approved' || r.claim_status == null)) {
        // claim_status is null for questions assigned directly (e.g. paid
        // "Doğrudan Soru Sor" submissions) — these skip the claim/approval
        // workflow entirely, so they're ready to answer immediately, same
        // as an approved claim.
        actionHtml = `
          <textarea class="owner-response-ta" id="owner-resp-${r.id}" placeholder="Yanıtınızı buraya yazın..."></textarea>
          <button class="owner-submit-btn" onclick="submitMyResponse('${r.id}')">✓ Yanıtı Gönder</button>
        `;
      } else if (isMine && r.claim_status === 'pending') {
        actionHtml = `<div class="owner-unclaimed-note">⏳ Talebiniz admin onayı bekliyor — onaylandığında burada yanıt yazabileceksiniz.</div>`;
      } else if (isMine && r.claim_status === 'rejected') {
        actionHtml = `<div class="owner-unclaimed-note" style="border-left-color:var(--red);">❌ Bu talep reddedildi.</div>`;
      } else {
        actionHtml = `
          <div class="owner-unclaimed-note" style="margin-bottom:8px;">🕓 Ekip havuzunda bekliyor — henüz size atanmadı.</div>
          <button class="owner-submit-btn" style="background:var(--navy);" onclick="claimReview('${r.id}')">🙋 Bu Soruyu Üstlen</button>
        `;
      }

      return `
        <div class="owner-card ${r.status === 'pending' ? 'urgent' : ''}" id="owner-card-${r.id}">
          <div class="owner-card-top">
            <div class="owner-card-user">${userName} <span style="font-weight:400;color:var(--muted)">· ${OWNER_CAT_ICONS[r.category] || ''} ${r.category}</span></div>
            <span class="owner-card-status ${statusClass}">${OWNER_STATUS_LABELS[r.status] || r.status}</span>
            <span class="owner-card-time">${myTimeAgo(r.created_at)}</span>
          </div>
          <div class="owner-question">${myMdToHtml(r.question)}</div>
          ${r.abibot_answer ? `
          <div class="owner-abibot-answer">
            <div class="owner-abibot-label">🤖 AbiBOT'un Önceki Yanıtı — Doğrulayın veya Düzeltin</div>
            <div class="owner-abibot-body collapsed" id="abibot-body-${r.id}">${renderAbibotMarkdown(r.abibot_answer)}</div>
            <span class="owner-abibot-toggle" onclick="toggleAbibotAnswer('${r.id}', this)">Tümünü Gör ↓</span>
          </div>` : ''}
          ${actionHtml}
        </div>`;
    }).join('');
  }

  window.toggleAbibotAnswer = function(reviewId, toggleEl) {
    const body = document.getElementById(`abibot-body-${reviewId}`);
    const collapsed = body.classList.toggle('collapsed');
    toggleEl.textContent = collapsed ? 'Tümünü Gör ↓' : 'Daralt ↑';
  };

  const ADMIN_PROFILE_ID = '3e96d976-5c3a-4270-af88-6172f1751f9a';

  window.claimReview = async function(reviewId) {
    const btn = document.querySelector(`#owner-card-${reviewId} .owner-submit-btn`);
    if (btn) { btn.disabled = true; btn.textContent = 'Üstleniliyor...'; }

    const reviewBefore = myReviews.find(r => r.id === reviewId);

    // Guard against a race with another expert claiming the same question:
    // only succeeds if expert_id is still null at the moment of update.
    const { data, error } = await supabase.from('expert_reviews')
      .update({ expert_id: myExpertId, claim_status: 'pending' })
      .eq('id', reviewId)
      .is('expert_id', null)
      .select();

    if (error || !data || !data.length) {
      alert('Bu soru az önce başka bir uzman tarafından üstlenildi.');
    } else {
      await supabase.from('notifications').insert({
        user_id: ADMIN_PROFILE_ID,
        type: 'admin_notification',
        title: '🙋 Onay bekleyen talep',
        body: `${myExpertName}, "${reviewBefore?.category || ''}" kategorisindeki bir soruyu üstlenmek istiyor. Onayınız bekleniyor.`,
        link: '/expert-panel.html'
      });
    }

    const { data: reviews } = await supabase.from('expert_reviews')
      .select('*, profiles:user_id(first_name, last_name, city)')
      .or(`expert_id.eq.${myExpertId},expert_id.is.null`)
      .order('created_at', { ascending: false });
    myReviews = reviews || [];
    renderMyReviews();
  };

  window.submitMyResponse = async function(reviewId) {
    const ta = document.getElementById(`owner-resp-${reviewId}`);
    const response = ta.value.trim();
    if (!response) return;

    const btn = document.querySelector(`#owner-card-${reviewId} .owner-submit-btn`);
    btn.disabled = true; btn.textContent = 'Gönderiliyor...';

    await supabase.from('expert_reviews').update({
      expert_response: response,
      status: 'answered',
      answered_at: new Date().toISOString()
    }).eq('id', reviewId);

    const review = myReviews.find(r => r.id === reviewId);
    if (review) {
      await supabase.from('notifications').insert({
        user_id: review.user_id,
        type: 'expert_answered',
        title: 'Uzman yanıtınız hazır! ✅',
        body: 'AbiBOT sorunuz bir uzman tarafından incelendi ve yanıtlandı.',
        link: '/abibot.html'
      });

      await supabase.from('notifications').insert({
        user_id: ADMIN_PROFILE_ID,
        type: 'admin_notification',
        title: '✅ Soru yanıtlandı',
        body: `${myExpertName}, "${review.category || ''}" kategorisindeki soruyu yanıtladı.`,
        link: '/expert-panel.html'
      });

      try {
        await fetch('https://wxjudojlwksivhzjnmim.supabase.co/functions/v1/notify-user', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON}`,
          },
          body: JSON.stringify({
            review_id: review.id,
            user_id: review.user_id,
            category: review.category,
            question: review.question,
            expert_response: response,
          })
        });
      } catch(emailErr) {
        console.warn('Email notification failed (non-critical):', emailErr);
      }
    }

    // Refresh just this section rather than the whole page
    const { data: reviews } = await supabase.from('expert_reviews')
      .select('*, profiles:user_id(first_name, last_name, city)')
      .or(`expert_id.eq.${myExpertId},expert_id.is.null`)
      .order('created_at', { ascending: false });
    myReviews = reviews || [];
    renderMyReviews();
  };

  function renderProfile(expert, reviews) {
    const name = `${expert.first_name || ''} ${expert.last_name || ''}`.trim() || 'Uzman';
    const initials = ((expert.first_name?.[0] || '') + (expert.last_name?.[0] || '')).toUpperCase() || 'U';
    const colorIdx = name.charCodeAt(0) % AVATAR_COLORS.length;
    const avatarColor = AVATAR_COLORS[colorIdx];

    const avgRating = expert.avg_rating ? parseFloat(expert.avg_rating) : null;
    const starDisplay = avgRating
      ? '⭐'.repeat(Math.round(avgRating)) + '☆'.repeat(5 - Math.round(avgRating))
      : '☆☆☆☆☆';

    const categories = (expert.categories || []).map(c =>
      `<span class="badge badge-cat">${CAT_ICONS[c] || ''} ${CAT_NAMES[c] || c}</span>`
    ).join('');

    const languages = (expert.languages || []).map(l =>
      `<span class="badge badge-lang">${LANG_FLAGS[l] || ''} ${l.toUpperCase()}</span>`
    ).join('');

    const verifiedBadge = expert.is_verified
      ? `<span class="badge badge-verified">✓ Doğrulandı</span>` : '';

    const avgResponseText = expert.avg_response_hours
      ? `${expert.avg_response_hours} saat`
      : '24-48 saat';

    const reviewsHtml = reviews.length ? reviews.map(r => {
      const ratedDate = r.rated_at
        ? new Date(r.rated_at).toLocaleDateString('tr-TR', { day:'2-digit', month:'long', year:'numeric' })
        : '';
      const filled = '⭐'.repeat(r.rating);
      const empty = '☆'.repeat(5 - r.rating);
      return `
        <div class="review-item">
          <div class="review-cat">${CAT_ICONS[r.category] || ''} ${CAT_NAMES[r.category] || r.category}</div>
          <div class="review-stars">${filled}${empty}</div>
          ${r.rating_comment
            ? `<div class="review-comment">"${r.rating_comment}"</div>`
            : `<div class="review-comment" style="color:var(--sand);">Yorum yapılmadı.</div>`}
          <div class="review-meta">${ratedDate}</div>
        </div>`;
    }).join('') : `
      <div class="no-reviews">
        <div class="no-reviews-icon">⭐</div>
        <div class="no-reviews-text">Henüz değerlendirme yok. İlk değerlendirmeyi siz yapın!</div>
      </div>`;

    document.getElementById('page-content').innerHTML = `
      <!-- HERO -->
      <div class="hero">
        <div class="hero-avatar" style="background:${avatarColor};">${initials}</div>
        <div class="hero-info">
          <div class="hero-name">${name}</div>
          <div class="hero-title">${expert.title || 'Uzman'}</div>
          <div class="hero-badges">
            ${verifiedBadge}
            ${categories}
            ${languages}
          </div>
          ${expert.expert_bio ? `<div class="hero-bio">${expert.expert_bio}</div>` : ''}
          <div class="hero-cta" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <a href="abibot.html" class="btn-primary">🤖 AbiBOT'ta Soru Sor →</a>
            <button onclick="openAskModal()" style="display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:var(--ink);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:background .15s;" onmouseover="this.style.background='var(--navy)'" onmouseout="this.style.background='var(--ink)'">
              ✉️ Doğrudan Soru Sor
            </button>
            <button class="btn-report-expert" onclick="openExpertReportModal('${expert.expert_id}')">🚩 Şikayet Et</button>
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-row">
        <div class="stat-card">
          <div class="stat-stars">${starDisplay}</div>
          <div class="stat-val" style="color:var(--gold);font-size:24px;">${avgRating ? avgRating.toFixed(1) + ' / 5' : '—'}</div>
          <div class="stat-label">Ortalama Puan</div>
        </div>
        <div class="stat-card">
          <div class="stat-val">${expert.total_responses || 0}</div>
          <div class="stat-label">✅ Yanıtlanan Soru</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="font-size:20px;">${avgResponseText}</div>
          <div class="stat-label">⚡ Ortalama Yanıt Süresi</div>
        </div>
      </div>

      <!-- REVIEWS -->
      <div class="section-title">
        ⭐ Kullanıcı Değerlendirmeleri
        <span style="font-size:13px;font-weight:400;color:var(--muted);font-family:'Instrument Sans',sans-serif;">${expert.total_rated || 0} değerlendirme</span>
      </div>
      <div class="review-list">${reviewsHtml}</div>
    `;

    // Update page title and modal expert name
    document.title = `BizdenBize — ${name}`;
    window._expertName = name;
    const modalName = document.getElementById('modal-expert-name');
    if (modalName) modalName.textContent = `${name} · ${expert.title || 'Uzman'}`;
  }

  function showError(title, sub) {
    document.getElementById('page-content').innerHTML = `
      <div class="error-state">
        <div class="error-icon">🔍</div>
        <div class="error-title">${title}</div>
        <div class="error-sub">${sub}</div>
        <a href="uzmanlar.html" class="btn-primary" style="display:inline-flex;margin-top:20px;">← Tüm Uzmanlara Dön</a>
      </div>`;
  }
</script>

</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL  = 'https://wxjudojlwksivhzjnmim.supabase.co';
  const SUPABASE_ANON = 'sb_publishable_52tr_hEnnQ3kllZexTue0Q_ByF71303';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON);

  const DIRECT_PRICES = {
    legal:10, visa:10, medical:10,
    tax:8, employment:8, migration:8,
    housing:5, insurance:5, school:5
  };

  const CAT_NAMES = window.BB_CONFIG.categoryLabels;

  // Read expert_id and ?ask=1 from URL
  const params = new URLSearchParams(window.location.search);
  window._expertId = params.get('id');
  window._expertName = '';
  window._userCredits = 0;
  window._session = null;

  // Load session + credits
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    window._session = session;
    if (session) {
      const { data: p } = await supabase.from('profiles')
        .select('expert_credits, first_name, last_name')
        .eq('id', session.user.id).single();
      window._userCredits = p?.expert_credits || 0;
      window._userName = `${p?.first_name || ''} ${p?.last_name || ''}`.trim();
    }
    // Auto-open modal if ?ask=1
    if (params.get('ask') === '1') {
      openAskModal();
    }
    updateBalanceLabel();
  })();

  window.openAskModal = async function() {
    if (!window._session) {
      const go = confirm('Soru sormak için giriş yapmanız gerekiyor. Giriş sayfasına gitmek ister misiniz?');
      if (go) window.location.href = 'login.html';
      return;
    }
    document.getElementById('ask-modal').classList.add('open');
    document.body.style.overflow = 'hidden';

    // Re-fetch the real balance fresh on every open — the page-load fetch
    // may not have resolved yet (race condition, was showing 0 or a stale
    // value), and credits could also have changed since page load (e.g.
    // another tab/session). Show a neutral state while this resolves.
    document.getElementById('balance-label').textContent = 'Bakiyeniz kontrol ediliyor...';
    const { data: p } = await supabase.from('profiles')
      .select('expert_credits').eq('id', window._session.user.id).single();
    window._userCredits = p?.expert_credits || 0;

    updateBalanceLabel();
    updatePrice();
  };

  window.closeAskModal = function() {
    document.getElementById('ask-modal').classList.remove('open');
    document.body.style.overflow = '';
  };

  window.updatePrice = function() {
    const cat = document.getElementById('ask-category').value;
    const price = DIRECT_PRICES[cat] || null;
    const priceVal = document.getElementById('price-val');
    const priceLabel = document.getElementById('price-label');
    const pill = document.getElementById('price-pill');

    if (!price) {
      priceVal.textContent = '—';
      priceLabel.textContent = 'Kategori seçin';
      pill.classList.remove('insufficient');
    } else {
      priceVal.textContent = price + ' Kredi';
      priceLabel.textContent = CAT_NAMES[cat] + ' sorusu';
      const insufficient = window._userCredits < price;
      pill.classList.toggle('insufficient', insufficient);
      priceLabel.style.color = insufficient ? 'var(--red)' : 'var(--ink)';
    }
    updateSubmitBtn();
  };

  function updateBalanceLabel() {
    document.getElementById('balance-label').textContent =
      window._session
        ? `Bakiyeniz: ${window._userCredits} kredi`
        : 'Giriş yapılmamış';
  }

  window.updateSubmitBtn = function() {
    const cat = document.getElementById('ask-category').value;
    const qRaw = document.getElementById('ask-question').value;
    const q = qRaw.trim();
    const price = DIRECT_PRICES[cat] || 0;
    const btn = document.getElementById('ask-confirm-btn');
    const canAfford = window._userCredits >= price;
    const tooShort = q.length > 0 && q.length < 20;

    const counter = document.getElementById('question-char-count');
    if (counter) {
      counter.textContent = `${qRaw.length} / 1000`;
      counter.style.color = qRaw.length >= 1000 ? 'var(--red)' : 'var(--muted)';
    }

    btn.disabled = !cat || !q || !canAfford || q.length < 20;

    const buyCta = document.getElementById('buy-credit-cta');
    if (buyCta) buyCta.style.display = (cat && !canAfford) ? 'block' : 'none';

    if (cat && !canAfford) {
      btn.textContent = `Yetersiz kredi (${price} gerekli, ${window._userCredits} mevcut)`;
    } else if (cat && tooShort) {
      btn.textContent = `En az 20 karakter yazın (${q.length}/20)`;
    } else {
      btn.textContent = 'Soruyu Gönder →';
    }
  };

  window.submitDirectQuestion = async function() {
    const cat = document.getElementById('ask-category').value;
    const question = document.getElementById('ask-question').value.trim();
    const price = DIRECT_PRICES[cat];
    if (!cat || !question || !price) return;

    const btn = document.getElementById('ask-confirm-btn');
    btn.disabled = true;
    btn.textContent = 'Gönderiliyor...';

    try {
      // Insert expert_review with source='direct'
      const { error: insertErr } = await supabase.from('expert_reviews').insert({
        user_id: window._session.user.id,
        expert_id: window._expertId,
        category: cat,
        language: 'tr',
        question: question,
        status: 'pending',
        source: 'direct',
        direct_price: price,
        credits_charged: price
      });
      if (insertErr) throw insertErr;

      // Deduct credits
      const { error: deductErr } = await supabase.from('profiles')
        .update({ expert_credits: window._userCredits - price })
        .eq('id', window._session.user.id);
      if (deductErr) throw deductErr;

      // In-app notification
      await supabase.from('notifications').insert({
        user_id: window._session.user.id,
        type: 'expert_assigned',
        title: 'Sorunuz uzman ekibimize iletildi ✅',
        body: '24-48 saat içinde yanıt alacaksınız.',
        link: '/abibot.html'
      });

      // Email notification — confirms submission to the ASKER (this
      // template's subject/body are written to the person who just asked,
      // e.g. "Sorunuz uzmana iletildi").
      try {
        await fetch('https://wxjudojlwksivhzjnmim.supabase.co/functions/v1/notify-user', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
          body: JSON.stringify({
            type: 'direct_question',
            user_id: window._session.user.id,
            data: {
              expert_name: window._expertName || 'Uzmanımız',
              category: cat,
              category_name: CAT_NAMES[cat] || cat
            }
          })
        });
      } catch(emailErr) { console.warn('Asker email notification failed:', emailErr); }

      // Email notification — separately notifies the EXPERT that a new
      // direct question is waiting for them. window._expertId is the
      // experts.id from the URL, not a user id, so we look up profile_id
      // to know who to actually email. See Backlog #22.
      try {
        const { data: expertRow } = await supabase.from('experts')
          .select('profile_id').eq('id', window._expertId).single();

        if (expertRow?.profile_id) {
          await fetch('https://wxjudojlwksivhzjnmim.supabase.co/functions/v1/notify-user', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON}` },
            body: JSON.stringify({
              type: 'direct_question_expert',
              user_id: expertRow.profile_id,
              data: {
                asker_name: window._userName || 'Bir üye',
                category: cat,
                category_name: CAT_NAMES[cat] || cat,
                expert_row_id: window._expertId
              }
            })
          });
        } else {
          console.warn('Could not resolve expert profile_id — expert email not sent.');
        }
      } catch(emailErr) { console.warn('Expert email notification failed:', emailErr); }

      // Success state
      document.querySelector('.modal-body').innerHTML = `
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:48px;margin-bottom:16px;">✅</div>
          <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--ink);margin-bottom:8px;">Sorunuz gönderildi!</div>
          <div style="font-size:13px;color:var(--muted);line-height:1.65;">24-48 saat içinde uzman yanıtınız <strong>abibot.html</strong> sayfasında görünecek.</div>
          <div style="margin-top:16px;font-size:12px;color:var(--muted);padding:10px 14px;background:var(--warm);border-radius:8px;">
            ${price} kredi kullanıldı · Kalan: ${window._userCredits - price} kredi
          </div>
        </div>`;
      document.querySelector('.modal-foot').innerHTML = `
        <button onclick="closeAskModal();window.location.href='abibot.html'" class="btn-confirm">AbiBOT'ta Görüntüle →</button>
        <button class="btn-cancel" onclick="closeAskModal()">Kapat</button>`;

      window._userCredits -= price;

    } catch(err) {
      console.error('Direct question error:', err);
      btn.disabled = false;
      btn.textContent = 'Tekrar Dene';
    }
  };
</script>
<!-- EXPERT REPORT MODAL -->
<div class="report-modal-overlay" id="expert-report-modal" onclick="if(event.target===this)closeExpertReportModal()">
  <div class="report-modal-box" id="expert-report-box">
    <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:4px;">🚩 Uzmanı Şikayet Et</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5;">Topluluk kurallarını ihlal eden durumları bildirin. Ekibimiz en kısa sürede inceleyecek.</div>
    <select class="report-select" id="expert-report-reason">
      <option value="">Şikayet nedeni seçin...</option>
      <option value="spam">📢 Spam / Reklam</option>
      <option value="harassment">😡 Taciz / Uygunsuz Davranış</option>
      <option value="fake">🎭 Sahte Uzman</option>
      <option value="inappropriate">🚫 Yanlış / Zararlı Bilgi</option>
      <option value="scam">💸 Dolandırıcılık</option>
      <option value="other">📝 Diğer</option>
    </select>
    <textarea class="report-textarea" id="expert-report-details" placeholder="Ek açıklama (isteğe bağlı)..."></textarea>
    <button id="expert-report-submit" onclick="submitExpertReport()" style="width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Instrument Sans',sans-serif;transition:background .15s;margin-bottom:8px;">Şikayeti Gönder</button>
    <button onclick="closeExpertReportModal()" style="width:100%;padding:9px;background:none;border:1.5px solid var(--sand);border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;font-family:'Instrument Sans',sans-serif;">İptal</button>
  </div>
</div>

<script>
  const _SB_URL  = 'https://wxjudojlwksivhzjnmim.supabase.co';
  const _SB_ANON = 'sb_publishable_52tr_hEnnQ3kllZexTue0Q_ByF71303';
  let _reportExpertId = null;

  window.openExpertReportModal = function(expertId) {
    _reportExpertId = expertId;
    document.getElementById('expert-report-reason').value = '';
    document.getElementById('expert-report-details').value = '';
    document.getElementById('expert-report-box').innerHTML = document.getElementById('expert-report-box').innerHTML; // reset
    document.getElementById('expert-report-modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeExpertReportModal = function() {
    document.getElementById('expert-report-modal').classList.remove('open');
    document.body.style.overflow = '';
  };
  window.submitExpertReport = async function() {
    const reason = document.getElementById('expert-report-reason').value;
    const details = document.getElementById('expert-report-details').value.trim();
    if (!reason) { document.getElementById('expert-report-reason').style.borderColor = 'var(--red)'; return; }

    const session = window._session;
    if (!session) {
      const go = confirm('Şikayet göndermek için giriş yapmalısınız. Giriş sayfasına gitmek ister misiniz?');
      if (go) window.location.href = 'login.html';
      return;
    }

    const btn = document.getElementById('expert-report-submit');
    btn.disabled = true; btn.textContent = 'Gönderiliyor...';

    try {
      const res = await fetch(`${_SB_URL}/rest/v1/reports`, {
        method: 'POST',
        headers: { 'apikey': _SB_ANON, 'Authorization': `Bearer ${session.access_token}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
        body: JSON.stringify({ reporter_id: session.user.id, reported_expert_id: _reportExpertId, type: 'expert', reason, details: details || null })
      });
      if (!res.ok) throw new Error(await res.text());

      document.getElementById('expert-report-box').innerHTML = `
        <div style="text-align:center;padding:16px 0;">
          <div style="font-size:40px;margin-bottom:12px;">✅</div>
          <div style="font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:6px;">Şikayet alındı</div>
          <div style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;">Ekibimiz en kısa sürede inceleyecek. Desteğiniz için teşekkürler.</div>
          <button onclick="closeExpertReportModal()" style="padding:10px 28px;background:var(--ink);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Instrument Sans',sans-serif;">Kapat</button>
        </div>`;
    } catch(e) {
      btn.disabled = false; btn.textContent = 'Şikayeti Gönder';
      alert('Hata: ' + e.message);
    }
  };
</script>
</body>
</html>
